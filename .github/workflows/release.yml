# Releases GhostCue for Windows by itself. On every push to main it reads __version__ in
# ghostcue/__init__.py; if there is no tag for that version yet, it builds the installer and the
# zip, tags the commit v<version> and publishes them as a release. To release, raise the version
# and push. Running the workflow by hand only builds the two files, as artifacts.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: |
          $version = [regex]::Match((Get-Content ghostcue\__init__.py -Raw), '__version__ = "(.+?)"').Groups[1].Value
          $released = git ls-remote --tags origin "refs/tags/v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "new=$(if ($released) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          if ($released) { "v$version is already released: nothing to build." } else { "v$version is new: building it." }

      - uses: actions/setup-python@v6
        if: steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt -r packaging\requirements.txt

      - name: Install Inno Setup
        if: steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        if: steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        run: .\packaging\build.ps1

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: GhostCue
          path: |
            dist/*.zip
            dist/*-setup.exe

      - name: Publish the release
        if: steps.version.outputs.new == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GhostCue v${{ steps.version.outputs.version }}
          body_path: packaging/release-notes.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*-setup.exe
