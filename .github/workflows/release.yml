# Builds GhostCue for Windows. Pushing a tag such as v0.1.0 also publishes the installer and
# the zip as a GitHub release; running the workflow by hand only builds them, as artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches the version in ghostcue/__init__.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = [regex]::Match((Get-Content ghostcue\__init__.py -Raw), '__version__ = "(.+?)"').Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }

      - name: Install
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt -r packaging\requirements.txt

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        run: .\packaging\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: GhostCue
          path: |
            dist/*.zip
            dist/*-setup.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GhostCue ${{ github.ref_name }}
          body_path: packaging/release-notes.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*-setup.exe
